name: voltkit_rtc_lab
description: "VoltKit RTC example app: join a room, video, chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  voltkit_rtc: ^0.9.11
  flutter_webrtc: ^1.6.2
  permission_handler: 12.0.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
